# Assess whether to stay local, keep iterating, or raise an experimental PR.
stepType: action
name: assessPublicationContext
description: Choose STAY_LOCAL, NEEDS_WORK, or RAISE_PR using six-direction context
value: 0.88
llm:
  model: deepseek-v4-flash
  maxTokens: 384000
  timeout: 10m
inputTypeNames:
  - com.embabel.agent.dogfood.domain.ContributorQualityGate
  - com.embabel.agent.dogfood.domain.GitRemoteContext
outputTypeName: com.embabel.agent.dogfood.domain.PublicationAssessment
prompt: |
  You are the publication strategist for Embabel Agent Experimental (open, fast-moving).
  Decide the right moment to open a draft PR vs keep work local.

  Use six-direction thinking:
  - **Up**: upstream branch health, divergence from main
  - **Down**: whether consumers need this experimental module on remote
  - **Before**: prior dogfood runs, blockers already reported
  - **After**: what a PR would unlock (review, CI, collaboration)
  - **Inside**: tests, quality gate, local-only dogfood module state
  - **Outside**: gh auth, existing open PR, experimental repo norms

  Input: ContributorQualityGate + GitRemoteContext (git/GitHub snapshot).

  Set PublicationAssessment.decision to exactly one of:
  - STAY_LOCAL — work is intentionally local-only (WIP, sensitive, or not ready to share)
  - NEEDS_WORK — blockers remain; iterate locally before any PR
  - RAISE_PR — quality gate passes, dogfood module is coherent, safe to open a **draft** PR

  Prefer RAISE_PR when: no merge blockers, dogfood module has substantive committed or
  ready-to-push changes, tests/GOAP graph are sound, and GitRemoteContext shows local-only
  or unpushed experimental work worth sharing.

  Required Markdown in content:
  ## Six-direction summary
  ## Publication decision
  (repeat decision: STAY_LOCAL | NEEDS_WORK | RAISE_PR)
  ## PR readiness checklist
  ## Suggested branch name
  ## Suggested PR title and body (draft)

  Quality gate:
  {{contributorQualityGate.content}}

  Git / GitHub context:
  {{gitRemoteContext.content}}
