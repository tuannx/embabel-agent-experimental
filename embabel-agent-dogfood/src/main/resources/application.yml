spring:
  application:
    name: embabel-agent-dogfood
  main:
    banner-mode: "off"
    web-application-type: none

embabel:
  agent:
    platform:
      llm-operations:
        prompts:
          default-timeout: ${DOGFOOD_LLM_TIMEOUT:10m}
        data-binding:
          max-attempts: ${DOGFOOD_LLM_MAX_ATTEMPTS:3}
          fixed-backoff-millis: ${DOGFOOD_LLM_BACKOFF_MILLIS:2000}
      models:
        deepseek:
          api-key: ${DEEPSEEK_API_KEY:}
          base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
          max-attempts: ${DOGFOOD_LLM_MAX_ATTEMPTS:3}
  models:
    default-llm: ${DOGFOOD_MODEL:deepseek-v4-flash}

dogfood:
  # Declarative agent graph. The generic YAML loader is the next migration
  # step; keeping this manifest in configuration avoids reintroducing a
  # dogfood-specific Kotlin bootstrap.
  dsl:
    enabled: ${DOGFOOD_DSL_ENABLED:true}
    steps-location: ${DOGFOOD_DSL_STEPS_LOCATION:classpath:/steps}
    agent-name: ${DOGFOOD_DSL_AGENT_NAME:oss-java-kotlin-expert}
    goal: ${DOGFOOD_DSL_GOAL:produceDogfoodReport}
  repository: ${DOGFOOD_REPOSITORY:/workspace/repo}
  output-directory: ${DOGFOOD_OUTPUT_DIRECTORY:/output}
  task: "${DOGFOOD_TASK:Review this repository and identify the highest-value next improvement.}"
  model: ${DOGFOOD_MODEL:deepseek-v4-flash}
  max-files: ${DOGFOOD_MAX_FILES:18}
  max-file-bytes: ${DOGFOOD_MAX_FILE_BYTES:10000}
  max-snapshot-bytes: ${DOGFOOD_MAX_SNAPSHOT_BYTES:36000}
  # Keep the application fallback aligned with the DSL's DeepSeek V4 budget.
  max-output-tokens: ${DOGFOOD_MAX_OUTPUT_TOKENS:384000}
  command-timeout: ${DOGFOOD_COMMAND_TIMEOUT:20s}
  run-on-startup: ${DOGFOOD_RUN_ON_STARTUP:true}
  memory:
    enabled: ${DOGFOOD_MEMORY_ENABLED:true}
    max-prior-runs: ${DOGFOOD_MEMORY_MAX_PRIOR_RUNS:5}
    github:
      enabled: ${DOGFOOD_MEMORY_GITHUB_ENABLED:true}
      repo: ${DOGFOOD_MEMORY_GITHUB_REPO:}
      label: ${DOGFOOD_MEMORY_GITHUB_LABEL:dogfood}
      sync-on-complete: ${DOGFOOD_MEMORY_GITHUB_SYNC:true}
  debug: ${DOGFOOD_DEBUG:true}
  publication:
    auto-raise-pr: ${DOGFOOD_PUBLICATION_AUTO_RAISE_PR:false}
    base-branch: ${DOGFOOD_PUBLICATION_BASE_BRANCH:main}
    draft-only: ${DOGFOOD_PUBLICATION_DRAFT_ONLY:true}
  improve:
    auto-improve: ${DOGFOOD_AUTO_IMPROVE:false}
    max-iterations: ${DOGFOOD_IMPROVE_MAX_ITERATIONS:2}
    invoke-cursor: ${DOGFOOD_IMPROVE_INVOKE_CURSOR:false}
