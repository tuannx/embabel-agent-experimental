services:
  dogfood:
    image: embabel-agent-dogfood:local
    build:
      context: .
      dockerfile: embabel-agent-dogfood/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in dogfood.env or your shell}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DOGFOOD_MODEL: ${DOGFOOD_MODEL:-deepseek-v4-flash}
      DOGFOOD_DSL_ENABLED: ${DOGFOOD_DSL_ENABLED:-true}
      DOGFOOD_DSL_STEPS_LOCATION: ${DOGFOOD_DSL_STEPS_LOCATION:-classpath:/steps}
      DOGFOOD_DSL_AGENT_NAME: ${DOGFOOD_DSL_AGENT_NAME:-oss-java-kotlin-expert}
      DOGFOOD_DSL_GOAL: ${DOGFOOD_DSL_GOAL:-produceDogfoodReport}
      DOGFOOD_TASK: "${DOGFOOD_TASK:-As a top 1% OSS Java/Kotlin engineer, dogfood this Embabel experimental repo: review code, gate against contributor principles, and draft concise GitHub interactions.}"
      DOGFOOD_MAX_FILES: ${DOGFOOD_MAX_FILES:-18}
      DOGFOOD_MAX_FILE_BYTES: ${DOGFOOD_MAX_FILE_BYTES:-10000}
      DOGFOOD_MAX_SNAPSHOT_BYTES: ${DOGFOOD_MAX_SNAPSHOT_BYTES:-36000}
      DOGFOOD_MAX_OUTPUT_TOKENS: ${DOGFOOD_MAX_OUTPUT_TOKENS:-384000}
      DOGFOOD_LLM_TIMEOUT: ${DOGFOOD_LLM_TIMEOUT:-10m}
      DOGFOOD_LLM_MAX_ATTEMPTS: ${DOGFOOD_LLM_MAX_ATTEMPTS:-3}
      DOGFOOD_COMMAND_TIMEOUT: ${DOGFOOD_COMMAND_TIMEOUT:-20s}
      DOGFOOD_RUN_ON_STARTUP: ${DOGFOOD_RUN_ON_STARTUP:-true}
      DOGFOOD_MEMORY_ENABLED: ${DOGFOOD_MEMORY_ENABLED:-true}
      DOGFOOD_MEMORY_GITHUB_ENABLED: ${DOGFOOD_MEMORY_GITHUB_ENABLED:-true}
      GH_CONFIG_DIR: /home/embabel/.config/gh
      HOME: /home/embabel
      # Injected by scripts/dogfood-run.sh from `gh auth token` on the host (macOS keychain).
      GH_TOKEN: ${GH_TOKEN:-}
      DOGFOOD_AUTO_IMPROVE: ${DOGFOOD_AUTO_IMPROVE:-false}
      DOGFOOD_IMPROVE_MAX_ITERATIONS: ${DOGFOOD_IMPROVE_MAX_ITERATIONS:-2}
      DOGFOOD_IMPROVE_INVOKE_CURSOR: ${DOGFOOD_IMPROVE_INVOKE_CURSOR:-false}
    volumes:
      - .:/workspace/repo:ro
      - ./build/dogfood:/output
      - ${HOME}/.config/gh:/home/embabel/.config/gh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
